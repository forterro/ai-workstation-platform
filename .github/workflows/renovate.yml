name: Renovate

on:
  schedule:
    # Daily; opens a PR for every update detected on the run (no PR rate limits).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options:
          - debug
          - info
          - warn
          - error

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # Permit the postUpgradeTasks `make deps` re-vendoring (Chart.lock + charts/*.tgz).
          RENOVATE_ALLOWED_COMMANDS: '["^make deps$"]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}

  # A red run on a Renovate PR or a scheduled run is easy to miss: track it in an issue
  # (commented on every new failure, closed by the next green run).
  report:
    name: Report CI failures
    needs: [renovate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open / close the CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ISSUE_ASSIGNEES: ${{ vars.CI_ISSUE_ASSIGNEES }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          args=()
          python3 .github/scripts/ci-issue.py "$RESULT" --key "renovate" \
            --title "Renovate run failure" "${args[@]}"
